; Vorlage -- echte Werte kommen als Actions-Secrets ANGABE_<SCHLUESSEL> in vermora-releases, nie ins Repo
; --- Eigene Angaben fuer Impressum, Datenschutz und security.txt (Issue #1234/#1244) ---
; Muss der LETZTE Abschnitt bleiben. Werte in "...", kein " im Wert. Leer = Seite zeigt weiter die Marke,
; pruefen.py --veroeffentlichung sperrt. Ins Repo kommen nur leere Werte.
[angaben]
name                  = ""   ; Vor- und Nachname (Impressum, Datenschutz "Verantwortlich")
strasse               = ""   ; Strasse und Hausnummer, kein Postfach (ladungsfaehig) oder c/o-Zeile
ort                   = ""   ; Postleitzahl und Ort
email                 = ""   ; eigene Vermora-Adresse; Impressum, Datenschutz, security.txt
aufsicht              = ""   ; Landesdatenschutzbehoerde am Wohnsitz: Name, Anschrift, Website
security_ablauf       = ""   ; Ablauf security.txt, JJJJ-MM-TT, hoechstens ein Jahr voraus, jaehrlich erneuern
stand_datenschutz     = ""   ; Stand der Datenschutzerklaerung, TT.MM.JJJJ -- neu setzen, wenn sich ein Wert hier aendert
paypal_link           = ""   ; ganze Adresse der PayPal-Seite (https://www.paypal.com/... oder https://paypal.me/...), Geschenk-Hinweis
